{% extends "base_admin.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block cuerpo %}
<div class="solo card">
  <h1>Crear cuenta</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="nombre">Nombre
      <input id="nombre" name="nombre" autocomplete="name" value="{{ request.form.nombre }}"></label>
    <label for="celular">Celular <small>Con código de área, solo números</small>
      <input id="celular" name="celular" inputmode="tel" autocomplete="tel" required value="{{ request.form.celular }}"></label>
    <label for="clave">Contraseña <small>Mínimo 6 caracteres</small>
      <input id="clave" name="clave" type="password" autocomplete="new-password" required minlength="6"></label>
    <label for="clave2">Repetí la contraseña
      <input id="clave2" name="clave2" type="password" autocomplete="new-password" required minlength="6"></label>
    <button class="btn" type="submit">Crear cuenta</button>
  </form>
  <p class="muted">¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
{% endblock %}
